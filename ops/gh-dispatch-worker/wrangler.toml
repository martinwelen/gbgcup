name = "gbgcup-dispatch-worker"
main = "worker.js"
compatibility_date = "2026-01-01"

# Cron: var 10:e minut. Workern no-oppar utanför ACTIVE_FROM/UNTIL, så den kan
# ligga kvar deployad året runt utan att trigga mellan cuper.
[triggers]
crons = ["*/10 * * * *"]

[vars]
GH_OWNER = "martinwelen"
GH_REPO = "gbgcup"
GH_WORKFLOW = "update.yml"
GH_REF = "main"
# FORCE = "false"
# Göteborg Cup 2026: helg 1 (4–6 sep) + helg 2 (11–13 sep). Ett spann täcker båda.
ACTIVE_FROM = "2026-09-04"
ACTIVE_UNTIL = "2026-09-13"

# Secrets (sätts EJ här — via wrangler):
#   wrangler secret put GITHUB_TOKEN     # fine-grained PAT (gbgcup), Actions: Read and write
#   wrangler secret put TRIGGER_KEY      # (valfritt) skyddar /trigger
